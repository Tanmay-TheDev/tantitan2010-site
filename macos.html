<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">



<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1a33">
<title>macOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
 --mb-h:30px;--accent:#007aff;--red:#ff5f57;--yel:#febc2e;--grn:#28c840;
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 --win-bg:#fff;--win-chrome:rgba(246,246,247,.9);--win-border:rgba(0,0,0,.16);
 --side-bg:rgba(238,238,242,.92);--text:#1d1d1f;--text2:#77777c;--sep:rgba(0,0,0,.1);
 --field:rgba(0,0,0,.06);--hover:rgba(0,0,0,.05);--drop-bg:rgba(244,244,247,.94);--drop-text:#1d1d1f;
 --dock-bg:rgba(255,255,255,.34);--dock-border:rgba(255,255,255,.5);
}
body.dark{
 --win-bg:#1e1f24;--win-chrome:rgba(38,38,43,.88);--win-border:rgba(255,255,255,.16);
 --side-bg:rgba(29,30,35,.92);--text:#f5f5f7;--text2:#9a9aa2;--sep:rgba(255,255,255,.11);
 --field:rgba(255,255,255,.09);--hover:rgba(255,255,255,.08);--drop-bg:rgba(32,32,37,.94);--drop-text:#f5f5f7;
 --dock-bg:rgba(26,26,30,.46);--dock-border:rgba(255,255,255,.17);
}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;width:100%;font-family:var(--font);font-size:13px;color:var(--text);background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text;font:inherit}
svg{display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,128,132,.45);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.blur{-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}

/* wallpaper */
#wallpaper{position:fixed;inset:0;overflow:hidden;background:#071018;background-size:cover;background-position:center;transition:opacity .5s ease}
#wallpaper.imgmode{background-size:cover;background-position:center;background-repeat:no-repeat;transform:none}
#wallpaper::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.22) 0%,transparent 18%,transparent 78%,rgba(0,0,0,.28) 100%)}
#wallpaper i{position:absolute;display:block;border-radius:50%;mix-blend-mode:screen;will-change:transform}
@keyframes d1{to{transform:translate(7%,-5%) scale(1.18)}}
@keyframes d2{to{transform:translate(-6%,6%) scale(1.12)}}
@keyframes d3{to{transform:translate(5%,8%) scale(.9)}}
.w-sonoma{background:linear-gradient(170deg,#26102e,#4c1c3d 55%,#6e2a45)}
.w-sonoma i:nth-child(1){width:90vmax;height:90vmax;left:-20vmax;top:-30vmax;background:radial-gradient(circle,#ff7e47 0%,transparent 60%);animation:d2 38s ease-in-out infinite alternate}
.w-sonoma i:nth-child(2){width:85vmax;height:85vmax;right:-25vmax;top:0;background:radial-gradient(circle,#ff5d8f 0%,transparent 62%);animation:d1 46s ease-in-out infinite alternate}
.w-sonoma i:nth-child(3){width:60vmax;height:60vmax;left:10vmax;bottom:-30vmax;background:radial-gradient(circle,#ffc86b 0%,transparent 60%);animation:d3 42s ease-in-out infinite alternate}
.w-ventura{background:linear-gradient(160deg,#03252c,#06414a 55%,#0a5a58)}
.w-ventura i:nth-child(1){width:90vmax;height:90vmax;left:-22vmax;top:-30vmax;background:radial-gradient(circle,#14b8a6 0%,transparent 62%);animation:d1 40s ease-in-out infinite alternate}
.w-ventura i:nth-child(2){width:80vmax;height:80vmax;right:-28vmax;top:-5vmax;background:radial-gradient(circle,#5ec8f2 0%,transparent 60%);animation:d3 44s ease-in-out infinite alternate}
.w-ventura i:nth-child(3){width:65vmax;height:65vmax;left:-5vmax;bottom:-30vmax;background:radial-gradient(circle,#f0d29a 0%,transparent 60%);animation:d2 46s ease-in-out infinite alternate}
.w-graphite{background:linear-gradient(165deg,#0b0c0f,#17181d 50%,#23242b)}
.w-graphite i:nth-child(1){width:95vmax;height:95vmax;left:-30vmax;top:-35vmax;background:radial-gradient(circle,#5b5f6a 0%,transparent 62%);animation:d1 44s ease-in-out infinite alternate}
.w-graphite i:nth-child(2){width:75vmax;height:75vmax;right:-20vmax;top:5vmax;background:radial-gradient(circle,#8b8f98 0%,transparent 60%);animation:d2 38s ease-in-out infinite alternate}
.w-graphite i:nth-child(3){width:70vmax;height:70vmax;left:5vmax;bottom:-35vmax;background:radial-gradient(circle,#3c4048 0%,transparent 62%);animation:d3 48s ease-in-out infinite alternate}

/* boot / off / sleep */
#boot,#off,#sleepOv{position:fixed;inset:0;background:#000;z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:64px;transition:opacity .7s}
#boot svg{width:76px;fill:#e8e8ed;filter:drop-shadow(0 0 26px rgba(255,255,255,.25))}
#bootBar{width:172px;height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
#bootFill{height:100%;width:0;background:#fff;border-radius:99px}
#boot.hidden,#off.hidden{opacity:0;pointer-events:none}
#sleepOv{z-index:380;opacity:0;pointer-events:none;cursor:pointer}
#sleepOv.on{opacity:1;pointer-events:auto}
#off{z-index:410;color:#666;font-size:12px;letter-spacing:.4px;gap:26px;display:none}
#off.on{display:flex}
#off .pwr{width:54px;height:54px;border-radius:50%;border:1.5px solid #333;display:flex;align-items:center;justify-content:center;color:#555;font-size:20px}

/* login */
#login{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;-webkit-backdrop-filter:blur(46px) saturate(160%);backdrop-filter:blur(46px) saturate(160%);background:rgba(8,10,22,.25);transition:opacity .55s,transform .55s;color:#fff}
#login.gone{opacity:0;transform:scale(1.06);pointer-events:none}
#lgClock{margin-top:9vh;text-align:center;text-shadow:0 2px 26px rgba(0,0,0,.4)}
#lgTime{font-size:clamp(58px,10vw,96px);font-weight:600;letter-spacing:-2px;line-height:1}
#lgDate{font-size:clamp(15px,2.4vw,21px);font-weight:500;opacity:.92;margin-top:8px}
#lgPanel{margin-top:auto;margin-bottom:12vh;display:flex;flex-direction:column;align-items:center;gap:12px}
#lgAva{width:92px;height:92px;border-radius:50%;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.45);transition:transform .3s;background:#222}
#lgAva img{width:100%;height:100%;object-fit:cover}
#lgPanel:hover #lgAva{transform:scale(1.04)}
#lgName{font-size:17px;font-weight:600;text-shadow:0 1px 10px rgba(0,0,0,.4)}
#lgPwRow{display:flex;align-items:center;gap:8px;height:34px;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
#lgPwRow.show{opacity:1;transform:none;pointer-events:auto}
#lgPw{width:170px;height:30px;border-radius:99px;border:0;outline:0;background:rgba(255,255,255,.92);padding:0 14px;font-size:13px;color:#111}
#lgGo{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
#lgHint{font-size:11.5px;opacity:.65}

/* desktop shell */
#desktop{position:fixed;inset:0;display:none}
#desktop.ready{display:block}
@keyframes mbIn{from{transform:translateY(-100%)}}
@keyframes dkIn{from{transform:translate(-50%,120%)}}
#desktop.ready #menubar{animation:mbIn .55s cubic-bezier(.3,1,.4,1) both}
#desktop.ready #dock{animation:dkIn .55s cubic-bezier(.3,1,.4,1) .1s both}

/* menubar */
#menubar{position:absolute;top:0;left:0;right:0;height:var(--mb-h);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:rgba(16,18,28,.32);color:#fff;font-size:13px;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
body.dark #menubar{background:rgba(10,10,14,.5)}
#mbLeft,#mbRight{display:flex;align-items:center;height:100%;gap:1px;min-width:0}
.mb-btn{height:22px;padding:0 8px;border-radius:5px;display:flex;align-items:center;gap:5px;color:#fff;white-space:nowrap}
.mb-btn:active,.mb-btn.pressed{background:rgba(255,255,255,.22)}
.mb-btn svg{width:15px;height:15px;fill:currentColor}
.menu{position:relative;height:100%;display:flex;align-items:center}
.m-label{padding:0 9px;height:22px;border-radius:5px;display:flex;align-items:center;cursor:default}
.m-label svg{width:14px;height:14px;fill:#fff}
.menu.open .m-label,.m-label:hover{background:rgba(255,255,255,.22)}
@keyframes dropIn{from{opacity:0;transform:scale(.98) translateY(-3px)}}
.m-drop{display:none;position:absolute;top:calc(100% + 5px);left:0;min-width:228px;padding:5px;border-radius:9px;background:var(--drop-bg);color:var(--drop-text);box-shadow:0 14px 44px rgba(0,0,0,.4),0 0 0 .5px rgba(0,0,0,.15);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);transform-origin:top left;animation:dropIn .13s ease-out;z-index:99}
.menu.open .m-drop{display:block}
.m-item{padding:4px 10px;border-radius:5px;display:flex;justify-content:space-between;gap:20px;white-space:nowrap}
.m-item:hover{background:var(--accent);color:#fff}
.m-item:hover .sc{color:rgba(255,255,255,.75)}
.m-item.dis{opacity:.4;pointer-events:none}
.m-sep{height:1px;background:var(--sep);margin:5px 10px}
.sc{color:var(--text2);font-size:12px}

/* windows */
#windows{position:absolute;inset:0;z-index:10}
.window{position:absolute;display:flex;contain:layout paint;flex-direction:column;border-radius:11px;overflow:hidden;background:var(--win-bg);box-shadow:0 30px 80px rgba(0,0,0,.45),0 3px 12px rgba(0,0,0,.25),0 0 0 .5px var(--win-border),inset 0 .5px 0 rgba(255,255,255,.12);resize:both;min-width:300px;min-height:200px}
.window.no-resize{resize:none}
.window.minimized{visibility:hidden;pointer-events:none}
.window.dragging{transition:none!important;cursor:grabbing}
.window.dragging *{pointer-events:none}
.window.anim{transition:left .38s cubic-bezier(.32,.9,.35,1),top .38s cubic-bezier(.32,.9,.35,1),width .38s cubic-bezier(.32,.9,.35,1),height .38s cubic-bezier(.32,.9,.35,1)}
@keyframes winIn{from{opacity:0;transform:scale(.88) translateY(16px)}}
.window.opening{animation:winIn .3s cubic-bezier(.24,1.2,.4,1)}
@keyframes winOut{to{opacity:0;transform:scale(.93) translateY(8px)}}
.window.closing{animation:winOut .18s ease-in forwards;pointer-events:none}
.titlebar{flex:0 0 40px;height:40px;display:flex;align-items:center;padding:0 12px;position:relative;background:var(--win-chrome);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border-bottom:.5px solid var(--sep);touch-action:none;cursor:default}
.win-title{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:var(--text);opacity:.9;pointer-events:none;max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.window:not(.active) .win-title{opacity:.5}
.traffic{display:flex;gap:8px;z-index:2}
.tl{width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;background:#d6d6d9;transition:background .15s}
.window.active .tl.red{background:var(--red)}.window.active .tl.yel{background:var(--yel)}.window.active .tl.grn{background:var(--grn)}
.tl svg{width:8px;height:8px;stroke:rgba(0,0,0,.55);stroke-width:1.6;fill:none;opacity:0;stroke-linecap:round}
.window.active .traffic:hover .tl svg{opacity:1}
.win-body{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative}

/* ---------- DOCK (fixed: no clipping, room for magnification) ---------- */
#dock{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:50;padding:7px 9px 6px;border-radius:22px;background:var(--dock-bg);border:.5px solid var(--dock-border);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);overflow:visible}
#dockList{display:flex;align-items:flex-end;gap:5px;height:84px}
.dock-item{position:relative;width:54px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.di-glyph{width:50px;height:50px;transform:scale(var(--s,1));transform-origin:bottom center;will-change:transform}
.dock-item .dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.9);margin-top:3px;opacity:0}
.dock-item.run .dot{opacity:1}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%) scale(.9);white-space:nowrap;background:rgba(40,40,46,.82);color:#fff;padding:4px 11px;border-radius:7px;font-size:12px;pointer-events:none;opacity:0;transition:.15s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(40,40,46,.82)}
@media(hover:hover){.dock-item:hover .tip{opacity:1;transform:translateX(-50%) scale(1)}}
.dock-sep{width:1px;height:50px;background:rgba(128,128,132,.4);margin:0 5px;align-self:flex-end;margin-bottom:8px}
@keyframes bounce{0%,100%{transform:translateY(0)}28%{transform:translateY(-26px)}55%{transform:translateY(0)}72%{transform:translateY(-12px)}}
.dock-item.bounce .di-glyph{animation:bounce .9s cubic-bezier(.3,.6,.4,1)}
/* touch devices: scrollable dock */
@media (hover:none){
 #dock{max-width:97vw;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
 #dock::-webkit-scrollbar{display:none}
}

/* app icon wrapper */
.aico{position:relative;width:100%;height:100%;border-radius:22.5%;overflow:hidden;background:var(--fb,linear-gradient(135deg,#888,#444));box-shadow:0 5px 12px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.22)}
.aico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.aico svg{width:100%;height:100%}

/* launchpad */
#lp{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;padding-top:7vh;background:rgba(8,10,20,.42);-webkit-backdrop-filter:blur(36px) saturate(150%);backdrop-filter:blur(36px) saturate(150%)}
#lp.on{display:flex;animation:dropIn .25s ease-out}
#lpSearch{width:min(300px,80vw);height:32px;border-radius:9px;border:.5px solid rgba(255,255,255,.3);outline:0;background:rgba(255,255,255,.16);color:#fff;padding:0 12px;text-align:center;font-size:13px}
#lpSearch::placeholder{color:rgba(255,255,255,.65)}
#lpGrid{margin-top:6vh;display:grid;grid-template-columns:repeat(6,96px);gap:44px 34px;justify-content:center;max-width:920px;padding:0 20px}
.lp-item{display:flex;flex-direction:column;align-items:center;gap:9px;color:#fff;font-size:12.5px;text-shadow:0 1px 6px rgba(0,0,0,.5);cursor:default}
.lp-item .aico{width:76px;height:76px;transition:transform .15s,filter .15s}
.lp-item:hover .aico{transform:scale(1.07)}
.lp-item:active .aico{transform:scale(.95);filter:brightness(.8)}
@keyframes lpIn{from{opacity:0;transform:scale(.4) translateY(30px)}}
#lp.on .lp-item{animation:lpIn .45s cubic-bezier(.25,1.3,.4,1) backwards;animation-delay:calc(var(--i)*16ms)}
.lp-item.hide{display:none}

/* spotlight */
#sp{position:fixed;top:16vh;left:50%;transform:translateX(-50%);z-index:75;width:min(620px,92vw);display:none;border-radius:14px;overflow:hidden;background:var(--drop-bg);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%)}
#sp.on{display:block;animation:dropIn .18s ease-out}
#spInput{width:100%;height:52px;border:0;outline:0;background:transparent;color:var(--drop-text);font-size:24px;font-weight:300;padding:0 18px}
#spRes{border-top:.5px solid var(--sep);max-height:320px;overflow:auto;padding:6px;display:none}
.sp-row{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:8px;color:var(--drop-text)}
.sp-row .aico,.sp-row .fico{width:30px;height:30px;border-radius:7px;flex:0 0 30px}
.sp-row.sel{background:var(--accent);color:#fff}
.sp-row small{margin-left:auto;opacity:.55}

/* cc / nc */
#cc,#nc{position:fixed;top:calc(var(--mb-h) + 8px);right:10px;z-index:72;display:none;color:var(--text)}
#cc{width:330px}
#cc.on,#nc.on{display:block;animation:dropIn .2s ease-out}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cc-card{border-radius:14px;padding:11px;background:var(--drop-bg);box-shadow:0 12px 34px rgba(0,0,0,.32);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%)}
.cc-card.wide{grid-column:1/-1}
.cc-tog{display:flex;align-items:center;gap:9px;padding:5px 2px;border-radius:8px;width:100%;text-align:left}
.cc-ico{width:28px;height:28px;border-radius:50%;background:rgba(120,120,128,.28);display:flex;align-items:center;justify-content:center;flex:0 0 28px;transition:.2s}
.cc-ico svg{width:15px;height:15px;fill:#fff}
.cc-ico.on{background:var(--accent)}.cc-ico.on.g{background:#34c759}.cc-ico.on.p{background:#5e5ce6}
.cc-tog b{font-size:12px;display:block}.cc-tog small{font-size:10.5px;color:var(--text2);display:block}
.cc-sl{display:flex;flex-direction:column;gap:8px}
.cc-sl label{font-size:11.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.cc-sl label svg{width:14px;height:14px;fill:var(--text)}
.cc-track{position:relative;height:26px;border-radius:99px;background:rgba(120,120,128,.26);overflow:hidden;cursor:pointer;touch-action:none}
.cc-fill{position:absolute;inset:0;width:60%;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.2)}
body.dark .cc-fill{background:#e6e6eb}
.cc-np{display:flex;align-items:center;gap:10px}
.cc-np .art{width:38px;height:38px;border-radius:8px;background:linear-gradient(135deg,#f97316,#db2777)}
.cc-np b{font-size:12px}.cc-np small{color:var(--text2);font-size:10.5px;display:block}
.cc-np .pl{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(120,120,128,.24);display:flex;align-items:center;justify-content:center}
.cc-np .pl svg{width:12px;fill:var(--text)}
#nc{width:330px;flex-direction:column;gap:11px}
#nc.on{display:flex}
.widget{border-radius:16px;padding:14px;background:var(--drop-bg);box-shadow:0 12px 34px rgba(0,0,0,.32);color:var(--text);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%)}
.wg-clock{display:flex;align-items:baseline;gap:8px}
.wg-clock b{font-size:40px;font-weight:600;letter-spacing:-1px}
.wg-clock span{font-size:20px;color:var(--text2);font-weight:500}
.wg-cal table{width:100%;border-collapse:collapse;font-size:11px;text-align:center;margin-top:8px}
.wg-cal th{color:var(--text2);font-weight:500;padding:3px 0}
.wg-cal td{padding:3.5px 0}
.wg-cal .today{background:#ff3b30;color:#fff;font-weight:700;width:24px;height:24px;line-height:24px;display:inline-block;border-radius:50%}
.wg-cal .hd{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.wg-wx{display:flex;justify-content:space-between;align-items:center}
.wg-wx .t{font-size:34px;font-weight:500}
.wg-wx svg{width:44px;height:44px}
.wg-row{display:flex;gap:11px}.wg-row .widget{flex:1}
.wg-bat{display:flex;align-items:center;gap:10px}
.wg-bat svg{width:32px;fill:var(--text)}

/* ctx / toasts */
#ctx{position:fixed;z-index:80;min-width:215px;padding:5px;border-radius:9px;display:none;background:var(--drop-bg);color:var(--drop-text);box-shadow:0 14px 44px rgba(0,0,0,.42),0 0 0 .5px rgba(0,0,0,.15);-webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%)}
#ctx.on{display:block;animation:dropIn .12s ease-out}
#ctx .m-item{padding:4px 10px;border-radius:5px}
#toasts{position:fixed;top:calc(var(--mb-h) + 10px);right:12px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{width:330px;display:flex;gap:11px;padding:11px 13px;border-radius:14px;align-items:flex-start;color:var(--text);background:var(--drop-bg);box-shadow:0 14px 40px rgba(0,0,0,.38);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);animation:toastIn .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes toastIn{from{opacity:0;transform:translateX(120%)}}
.toast.out{transition:.4s;opacity:0;transform:translateX(120%)}
.toast .t-ico{width:34px;height:34px;border-radius:8px;flex:0 0 34px;overflow:hidden;background:var(--accent);display:flex;align-items:center;justify-content:center}
.toast .t-ico img{width:100%;height:100%;object-fit:cover}
.toast .t-ico svg{width:20px;height:20px;fill:#fff}
.toast b{font-size:12.5px}.toast p{font-size:12px;color:var(--text2);margin-top:1px}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:360;transition:opacity .15s}
#dropzone{position:fixed;inset:0;z-index:96;display:none;align-items:center;justify-content:center;background:rgba(0,60,140,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#dropzone.on{display:flex}
#dropzone>div{border:3px dashed #fff;border-radius:24px;padding:56px 80px;color:#fff;font-size:22px;font-weight:700;text-align:center}
#dropzone small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:8px}

/* finder */
.f-wrap{flex:1;display:flex;min-height:0}
.f-side{flex:0 0 182px;background:var(--side-bg);border-right:.5px solid var(--sep);padding:9px 8px;overflow:auto;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.f-h{font-size:10.5px;font-weight:700;color:var(--text2);padding:9px 8px 4px}
.f-item{display:flex;align-items:center;gap:7px;padding:4.5px 8px;border-radius:6px;color:var(--text);cursor:default;font-size:12.5px;position:relative}
.f-item svg.fi{width:15px;height:15px;fill:var(--accent);flex:0 0 15px}
.f-item.on{background:rgba(120,120,128,.22)}
.f-item .ej{margin-left:auto;opacity:0;width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:11px}
.f-item:hover .ej{opacity:1}
.f-connect{margin:3px 8px;width:calc(100% - 16px);padding:6px 8px;border-radius:7px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.f-connect.alt{background:var(--field);color:var(--text)}
.f-connect svg{width:13px;height:13px;fill:currentColor}
.f-main{flex:1;display:flex;flex-direction:column;min-width:0}
.f-bar{flex:0 0 40px;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:.5px solid var(--sep)}
.f-bar .nav{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.f-bar .nav:not(.dis):hover{background:var(--hover)}
.f-bar .nav svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.f-bar .nav.dis{opacity:.35}
.f-bar .loc{font-weight:700;font-size:13px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-search{margin-left:auto;width:150px;height:25px;border-radius:7px;border:.5px solid var(--sep);background:var(--field);outline:0;padding:0 9px;font-size:12px;color:var(--text)}
.f-grid{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:6px 4px;align-content:start}
.f-node{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:8px;text-align:center;cursor:default}
.f-node:hover{background:var(--hover)}
.f-node.sel{background:rgba(0,122,255,.16)}
.f-node .nico{width:52px;height:52px}
.f-node .aico{width:52px;height:52px}
.f-node span{font-size:11.5px;line-height:1.25;word-break:break-word;max-height:29px;overflow:hidden}
.f-node small{font-size:9.5px;color:var(--text2)}
.f-empty{grid-column:1/-1;text-align:center;color:var(--text2);margin-top:60px;font-size:13px}
.f-status{flex:0 0 24px;border-top:.5px solid var(--sep);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(128,128,132,.3);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* preview / viewer */
.pv-bar{flex:0 0 42px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:.5px solid var(--sep);background:var(--win-chrome)}
.pv-badge{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;letter-spacing:.5px}
.pv-name{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%}
.pv-size{color:var(--text2);font-size:11px}
.pv-acts{margin-left:auto;display:flex;gap:6px}
.pv-acts button{height:26px;padding:0 10px;border-radius:7px;background:var(--field);font-size:11.5px;display:flex;align-items:center;gap:5px}
.pv-acts button:hover{background:var(--hover)}
.pv-acts svg{width:13px;height:13px;fill:currentColor}
.pv-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#2a2b30;position:relative}
.pv-stage.light{background:var(--win-bg)}
.pv-stage img{max-width:100%;max-height:100%;transition:transform .2s;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.pv-stage video{max-width:100%;max-height:100%;outline:0}
.pv-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#525659}
.pv-zoom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:rgba(30,30,34,.8);border-radius:9px;padding:4px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pv-zoom button{width:30px;height:26px;border-radius:6px;color:#fff;font-size:14px}
.pv-zoom button:hover{background:rgba(255,255,255,.15)}
.pv-zoom span{color:#fff;font-size:11px;display:flex;align-items:center;padding:0 8px;min-width:48px;justify-content:center}
.docx-view{background:#fff;color:#222;max-width:760px;margin:24px auto;padding:48px 56px;border-radius:6px;box-shadow:0 6px 30px rgba(0,0,0,.35);font-size:14px;line-height:1.6;user-select:text}
.docx-view h1{font-size:24px;margin:14px 0 8px}.docx-view h2{font-size:19px;margin:12px 0 6px}.docx-view h3{font-size:16px;margin:10px 0 5px}
.docx-view p{margin:8px 0}.docx-view table{border-collapse:collapse;margin:10px 0}
.docx-view td,.docx-view th{border:1px solid #ccc;padding:4px 8px;font-size:12px}
.docx-view img{max-width:100%}
.code-view{flex:1;overflow:auto;background:#14151a;color:#dfe2ea;font-family:var(--mono);font-size:12px;line-height:1.55;padding:16px 18px;white-space:pre;user-select:text;margin:0}
.xls-wrap{flex:1;overflow:auto;padding:14px}
.xls-wrap table{border-collapse:collapse;background:#fff;font-size:12px}
.xls-wrap td,.xls-wrap th{border:1px solid #d0d3d8;padding:4px 9px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xls-wrap th{background:#eef1f5;font-weight:600}
.xls-tabs{display:flex;gap:4px;padding:8px 14px 0}
.xls-tabs button{padding:4px 12px;border-radius:7px 7px 0 0;background:var(--field);font-size:11.5px}
.xls-tabs button.on{background:var(--accent);color:#fff}
.zip-list{flex:1;overflow:auto;padding:12px 16px}
.zip-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;font-size:12.5px}
.zip-row:hover{background:var(--hover)}
.zip-row svg{width:20px;height:20px;flex:0 0 20px}
.zip-row small{margin-left:auto;color:var(--text2)}
.pv-fallback{display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;padding:30px;text-align:center}
.pv-fallback .fico{width:72px;height:72px}
.pv-fallback b{font-size:15px}
.pv-fallback p{color:#aab;font-size:12px;max-width:340px}

/* ---------- SAFARI (real browsing) ---------- */
.s-bar{flex:0 0 48px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:.5px solid var(--sep);background:var(--win-chrome)}
.snav{width:28px;height:28px;border-radius:7px;color:var(--text2);font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 28px}
.snav:hover{background:var(--hover)}
.snav.dis{opacity:.32;pointer-events:none}
.snav.on{color:var(--accent);background:rgba(0,122,255,.13)}
.snav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.s-url{flex:1;max-width:560px;margin:0 auto;height:30px;border-radius:9px;background:var(--field);border:.5px solid var(--sep);display:flex;align-items:center;gap:7px;padding:0 12px;min-width:60px}
.s-url svg{width:12px;height:12px;fill:var(--text2);flex:0 0 12px}
.s-url input{flex:1;border:0;outline:0;background:transparent;text-align:center;font-size:12.5px;color:var(--text);min-width:0}
.s-load{height:2.5px;background:transparent;position:relative;overflow:hidden;flex:0 0 2.5px}
.s-loadbar{position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.s-frame-wrap{flex:1;position:relative;background:#fff}
.s-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.s-start{position:absolute;inset:0;overflow:auto;background:var(--win-bg)}
.s-hero{padding:34px 30px 8px;text-align:center}
.s-hero h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.s-sec{padding:14px 30px;max-width:760px;margin:0 auto}
.s-sec h3{font-size:14px;font-weight:700;margin-bottom:11px;color:var(--text2)}
.s-favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:16px}
.s-fav{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--text2);cursor:pointer}
.s-fav .fav-badge{width:56px;height:56px;font-size:22px;border-radius:13px;box-shadow:0 4px 10px rgba(0,0,0,.15);transition:transform .15s;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.s-fav:hover .fav-badge{transform:scale(1.08)}
.s-pr{display:flex;align-items:center;gap:14px;background:var(--field);border-radius:12px;padding:14px 16px}
.s-pr svg{width:34px;height:34px;fill:var(--accent);flex:0 0 34px}
.s-pr b{font-size:13px;display:block}.s-pr small{color:var(--text2);font-size:11.5px}
.s-toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(30,30,34,.88);color:#fff;font-size:11.5px;padding:7px 14px;border-radius:9px;display:flex;gap:10px;align-items:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.3);animation:dropIn .25s;white-space:nowrap}
.s-toast button{color:#5ac8fa;font-weight:600}
.s-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--win-bg);text-align:center;padding:20px}
.s-err b{font-size:16px}
.s-err p{color:var(--text2);font-size:12.5px;max-width:400px;line-height:1.5}
.s-err button{padding:7px 16px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
.s-err button.alt{background:var(--field);color:var(--text)}

/* notes */
.n-wrap{flex:1;display:flex;min-height:0}
.n-list{flex:0 0 218px;background:var(--side-bg);border-right:.5px solid var(--sep);display:flex;flex-direction:column}
.n-list-h{padding:10px;display:flex;justify-content:space-between;align-items:center}
.n-new{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.n-new:hover{background:var(--hover)}
.n-new svg{width:16px;height:16px;fill:currentColor}
.n-items{flex:1;overflow:auto;padding:0 8px 8px}
.n-it{padding:8px 10px;border-radius:8px;margin-bottom:2px;cursor:default}
.n-it.on{background:rgba(255,204,0,.3)}
.n-it b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-it small{color:var(--text2);font-size:11px;display:flex;gap:7px;white-space:nowrap;overflow:hidden}
.n-edit{flex:1;display:flex;flex-direction:column;min-width:0}
.n-tools{flex:0 0 38px;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:.5px solid var(--sep)}
.n-tools button{width:28px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px}
.n-tools button:hover{background:var(--hover)}
.n-area{flex:1;overflow:auto;padding:18px 24px;outline:0;font-size:14px;line-height:1.55;white-space:pre-wrap;color:var(--text)}

/* calculator */
.calc{flex:1;display:flex;flex-direction:column;background:#1c1c1e;color:#fff}
.c-disp{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px 20px;font-size:58px;font-weight:300;overflow:hidden;white-space:nowrap;letter-spacing:-1px}
.c-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 14px 14px}
.c-btn{aspect-ratio:1;border-radius:50%;font-size:23px;display:flex;align-items:center;justify-content:center;transition:filter .1s;background:#505055}
.c-btn:active{filter:brightness(1.6)}
.c-btn.fn{background:#3c3c40}
.c-btn.op{background:#ff9f0a;font-size:27px}
.c-btn.op.on{background:#fff;color:#ff9f0a}
.c-btn.zero{grid-column:span 2;aspect-ratio:auto;border-radius:99px;justify-content:flex-start;padding-left:26px}

/* terminal */
.term{flex:1;background:rgba(16,17,20,.96);color:#e8e8ed;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:10px 12px;overflow:auto;cursor:text}
.term .p-user{color:#7ce38b}.term .p-path{color:#5ac8fa}.term .err{color:#ff6b6b}.term .ok{color:#7ce38b}
.t-cur{display:inline-block;width:8px;height:15px;background:#e8e8ed;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.t-in{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}

/* settings */
.st-wrap{flex:1;display:flex;min-height:0}
.st-side{flex:0 0 202px;background:var(--side-bg);border-right:.5px solid var(--sep);overflow:auto;padding:12px 8px}
.st-it{display:flex;align-items:center;gap:9px;padding:5.5px 9px;border-radius:7px;cursor:default;font-size:12.5px}
.st-it.on{background:var(--accent);color:#fff}
.st-dot{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 22px}
.st-dot svg{width:13px;height:13px;fill:#fff}
.st-main{flex:1;overflow:auto;padding:22px 26px;min-width:0}
.st-main h2{font-size:19px;font-weight:700;margin-bottom:16px}
.st-cards{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.st-ap{width:130px;border-radius:10px;overflow:hidden;border:2.5px solid transparent;cursor:pointer;text-align:center}
.st-ap.on{border-color:var(--accent)}
.st-ap .pv{height:78px;background-size:cover;background-position:center}
.st-ap span{display:block;padding:6px;font-size:12px}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:13px}
.wp-th{aspect-ratio:16/10;border-radius:9px;cursor:pointer;border:2.5px solid transparent;position:relative;overflow:hidden;transition:transform .15s;background-size:cover;background-position:center}
.wp-th:hover{transform:scale(1.03)}
.wp-th.on{border-color:var(--accent)}
.wp-th span{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.st-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--field);border-radius:10px;margin-bottom:10px;gap:10px}
.st-row b{font-size:12.5px;font-weight:500}
.switch{width:40px;height:24px;border-radius:99px;background:rgba(120,120,128,.32);position:relative;transition:.2s;flex:0 0 40px}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.2s}
.switch.on{background:#34c759}
.switch.on::after{left:18px}
.st-slider{flex:1;margin:0 14px;height:24px;border-radius:99px;background:rgba(120,120,128,.28);position:relative;cursor:pointer;touch-action:none}
.st-slider i{position:absolute;inset:0;border-radius:99px;background:var(--accent);width:60%}
.st-bar{height:8px;border-radius:99px;background:rgba(120,120,128,.25);overflow:hidden;margin:8px 0 4px}
.st-bar i{display:block;height:100%;border-radius:99px}
.st-about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding-top:8px}
.st-about .mac{width:150px;height:96px;border-radius:12px;margin-bottom:12px;box-shadow:0 10px 26px rgba(0,0,0,.3);background-size:cover;background-position:center}
.st-vol{display:flex;align-items:center;gap:11px}
.st-vol svg{width:26px;height:26px;fill:var(--text2)}
.st-vol .eject{margin-left:auto;padding:5px 12px;border-radius:7px;background:var(--field);font-size:11.5px}

/* messages */
.m-wrap{flex:1;display:flex;min-height:0}
.m-side{flex:0 0 210px;background:var(--side-bg);border-right:.5px solid var(--sep);overflow:auto;padding:9px}
.m-cv{display:flex;gap:9px;padding:8px;border-radius:9px;align-items:center;cursor:default;margin-bottom:2px}
.m-cv.on{background:var(--accent);color:#fff}
.m-ava{width:36px;height:36px;border-radius:50%;flex:0 0 36px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px}
.m-cv b{font-size:12.5px;display:block}
.m-cv small{font-size:11px;opacity:.65;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.m-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--win-bg)}
.m-head{flex:0 0 42px;display:flex;align-items:center;justify-content:center;border-bottom:.5px solid var(--sep);font-weight:600;font-size:13px}
.m-body{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:5px}
.bub{max-width:72%;padding:7px 12px;border-radius:17px;font-size:13px;line-height:1.35;animation:winIn .25s ease-out}
.bub.them{background:var(--field);color:var(--text);align-self:flex-start;border-bottom-left-radius:5px}
.bub.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.typing{display:flex;gap:4px;align-items:center;padding:11px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9a9aa2;animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.m-in{flex:0 0 auto;display:flex;gap:8px;padding:9px 12px;border-top:.5px solid var(--sep)}
.m-in input{flex:1;height:31px;border-radius:99px;border:.5px solid var(--sep);background:var(--field);outline:0;padding:0 14px;font-size:13px;color:var(--text)}
.m-send{width:31px;height:31px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.m-send svg{width:14px;height:14px;fill:#fff}

/* photos / music */
.ph-wrap{flex:1;display:flex;min-height:0}
.ph-side{flex:0 0 150px;background:var(--side-bg);border-right:.5px solid var(--sep);padding:10px 8px}
.ph-grid{flex:1;overflow:auto;padding:12px;columns:4 150px;column-gap:10px}
.ph-it{break-inside:avoid;margin-bottom:10px;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;transition:transform .18s}
.ph-it:hover{transform:scale(1.025)}
.ph-lb{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:5;animation:winIn .2s}
.ph-lb>div{width:72%;aspect-ratio:4/3;border-radius:12px}
.ph-x{position:absolute;top:12px;right:14px;color:#fff;font-size:20px}
.mu-wrap{flex:1;display:flex;min-height:0}
.mu-side{flex:0 0 168px;background:var(--side-bg);border-right:.5px solid var(--sep);padding:10px 8px}
.mu-main{flex:1;overflow:auto;padding:18px 20px;min-width:0}
.mu-main h2{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-bottom:14px}
.mu-albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:16px}
.mu-al{cursor:pointer}
.mu-al .cov{aspect-ratio:1;border-radius:9px;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:transform .18s;display:flex;align-items:flex-end;padding:9px}

const VOLS=[];
let volSeq=1;
function buildTree(files){
 const root={dirs:{},files:[]};
 for(const f of files){
   const parts=(f.webkitRelativePath||f.name).split('/');
   let n=root;
   for(let i=1;i<parts.length-1;i++){n.dirs[parts[i]]=n.dirs[parts[i]]||{dirs:{},files:[]};n=n.dirs[parts[i]]}
   n.files.push(f);
 }
 return root;
}
function importFiles(files,name){
 if(!files.length)return;
 const flat=files.map(f=>({name:f.name,file:f}));
 const hasPaths=files.some(f=>f.webkitRelativePath&&f.webkitRelativePath.includes('/'));
 const root=hasPaths?buildTree(files):{dirs:{},files};
 const vol={id:volSeq++,name:name||'External',kind:'input',root,flat};
 VOLS.push(vol);
 refreshLocations();
 notify('Drive connected',`“${vol.name}” — ${files.length} item${files.length>1?'s':''} mounted`,DRIVE);
 finderGoVol(vol);
 return vol;
}
async function connectDrive(){
 if(window.showDirectoryPicker){
   try{
     const h=await window.showDirectoryPicker({mode:'read'});
     const vol={id:volSeq++,name:h.name||'External Drive',kind:'fsapi',root:h};
     VOLS.push(vol);refreshLocations();
     notify('Drive connected',`“${vol.name}” mounted and ready`,DRIVE);
     finderGoVol(vol);
   }catch(e){}
 }else{
   $('#dirInput').click();
 }
}
$('#dirInput').addEventListener('change',e=>{
 const files=[...e.target.files];
 if(files.length){const first=files[0].webkitRelativePath||'';importFiles(files,first.split('/')[0]||'External Drive')}
 e.target.value='';
});
$('#fileInput').addEventListener('change',e=>{importFiles([...e.target.files],'Imported Files');e.target.value=''});
function ejectVol(id){
 const i=VOLS.findIndex(v=>v.id===id);if(i<0)return;
 const [v]=VOLS.splice(i,1);
 notify('Drive ejected',`“${v.name}” was ejected safely`,DRIVE);
 refreshLocations();
 if(window.finderEjectCheck)finderEjectCheck(id);
}
try{navigator.usb&&navigator.usb.addEventListener&&navigator.usb.addEventListener('connect',()=>notify('USB device detected','Use Finder → Connect Drive to browse it',DRIVE))}catch(e){}

 $('#windows').append(w);S.wins[id]=w;

function focusWin(w){
 S.z++;w.style.zIndex=S.z;
 $$('.window').forEach(x=>x.classList.remove('active'));
 w.classList.add('active');S.active=w;
 renderMenus();
}
function closeWin(w){
 w.classList.add('closing');
 setTimeout(()=>{w.remove();delete S.wins[w.dataset.app];updateDots();if(S.active===w){S.active=null;renderMenus()}},190);
}
function minimizeWin(w){
 const icon=$(`.dock-item[data-app="${w.dataset.app}"] .di-glyph`);
 const r=icon?icon.getBoundingClientRect():{left:innerWidth/2,width:0,top:innerHeight};
 const b=w.getBoundingClientRect();
 w.style.transition='transform .45s cubic-bezier(.5,0,.6,.95),opacity .45s';
 w.style.transformOrigin='50% 100%';
 w.style.transform=`translate(${r.left+r.width/2-(b.left+b.width/2)}px,${r.top-b.top}px) scale(.06,.02)`;
 w.style.opacity='0';
 setTimeout(()=>{w.classList.add('minimized');w.style.transform='none';w.style.transition='';if(S.active===w){S.active=null;renderMenus()}},460);
}
function restoreWin(w){
 const icon=$(`.dock-item[data-app="${w.dataset.app}"] .di-glyph`);
 const r=icon?icon.getBoundingClientRect():{left:innerWidth/2,width:0,top:innerHeight};
 w.classList.remove('minimized');
 const b=w.getBoundingClientRect();
 const dx=r.left+r.width/2-(b.left+b.width/2),dy=r.top-(b.top+b.height);
 w.style.transition='none';w.style.transformOrigin='50% 100%';
 w.style.transform=`translate(${dx}px,${dy}px) scale(.06,.02)`;w.style.opacity='0';
 void w.offsetWidth;
 w.style.transition='transform .45s cubic-bezier(.3,.7,.4,1),opacity .3s';
 w.style.transform='none';w.style.opacity='1';
 setTimeout(()=>{w.style.transition='';w.style.transformOrigin=''},470);
}
function zoomWin(w){
 w.classList.add('anim');
 if(w.classList.contains('max')){
   w.classList.remove('max');
   Object.assign(w.style,{left:w.dataset.pl,top:w.dataset.pt,width:w.dataset.pw,height:w.dataset.ph});
 }else{
   w.dataset.pl=w.style.left;w.dataset.pt=w.style.top;w.dataset.pw=w.style.width;w.dataset.ph=w.style.height;
   w.classList.add('max');
   const dockH=isMobile()?0:100;
   Object.assign(w.style,{left:'6px',top:(MB_H+6)+'px',width:(innerWidth-12)+'px',height:(innerHeight-MB_H-dockH-12)+'px'});
 }
 setTimeout(()=>w.classList.remove('anim'),400);
}
function makeDraggable(w,tb){
 let drag=false,sx,sy,ox,oy;
 tb.addEventListener('pointerdown',e=>{
   if(e.target.closest('.tl,button,input,textarea,select,a,.switch,.st-slider,.c-btn,.f-item,.f-node,.f-list-row,.f-views,.wp-th,.st-it,.st-ap,.ej,.eject'))return;
   if(isMobile()||w.classList.contains('max'))return;
   drag=true;tb.setPointerCapture(e.pointerId);
   sx=e.clientX;sy=e.clientY;ox=w.offsetLeft;oy=w.offsetTop;
   w.classList.add('dragging');focusWin(w);
 });
 tb.addEventListener('pointermove',e=>{
   if(!drag)return;
   let x=ox+e.clientX-sx,y=Math.max(MB_H+4,oy+e.clientY-sy);
   x=Math.min(innerWidth-50,Math.max(50-w.offsetWidth,x));
   w.style.left=x+'px';w.style.top=y+'px';
 });
 const up=()=>{drag=false;w.classList.remove('dragging')};
 tb.addEventListener('pointerup',up);tb.addEventListener('pointercancel',up);
}

async function listFs(handle){
 try{if(handle.queryPermission){const p=await handle.queryPermission({mode:'read'});if(p!=='granted')await handle.requestPermission({mode:'read'})}}catch(e){}
 const out=[];
 for await(const e of handle.values())out.push({name:e.name,kind:e.kind,handle:e});
 out.sort((a,b)=>a.kind===b.kind?a.name.localeCompare(b.name):(a.kind==='directory'?-1:1));
 return out;
}

 const grid=body.querySelector('.f-grid'),loc=body.querySelector('.loc'),status=body.querySelector('.f-count');
 let hist=[{type:'demo',key:'Recents',label:'Recents'}],hi=0,q='',view='icon';
 win.fGo=key=>{go({type:'demo',key,label:key})};
 win.fGoVol=vol=>{go(volNode(vol))};
 win.fCheckEject=id=>{if(hist[hi].volId===id)go({type:'demo',key:'Recents',label:'Recents'});renderLocs()};
 function volNode(v){return v.kind==='fsapi'?{type:'fs',handle:v.root,label:v.name,volId:v.id}:{type:'tree',node:v.root,label:v.name,volId:v.id}}
 function renderLocs(){

 function treeItems(node){return [...Object.entries(node.dirs).map(([n,d])=>({n,treeDir:d})),...node.files.map(f=>({n:f.name,file:f}))]}
 function kindOf(it){
   if(it.a) return 'Application';
   if(it.demoF||it.k==='folder'||it.kind==='directory'||it.treeDir) return 'Folder';
   const ext=(it.n.split('.').pop()||'').toUpperCase();
   return ext.length<=5?ext+' File':'File';
 }
 function isFolder(it){return !!(it.demoF||it.k==='folder'||it.kind==='directory'||it.treeDir)}

   }catch(e){grid.innerHTML=`<div class="f-empty">Can't read this location.<br>Permission may have been denied.</div>`;return}

     }).join('');

     grid.innerHTML=list.map((it,i)=>{

       return `<div class="f-node" data-i="${i}"><div class="nico">${ico}</div><span>${it.n}</span><small>${isFolder(it)?'Folder':(it.file?fmtSize(it.file.size):'')}</small></div>`;

 function fmtSize(b){if(b>1e9)return (b/1e9).toFixed(1)+' GB';if(b>1e6)return (b/1e6).toFixed(1)+' MB';if(b>1e3)return (b/1e3).toFixed(0)+' KB';return b+' B'}

   const wire=()=>{
     body.querySelector('[data-dl]').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=meta.name;a.click()};

   };
   const isImg=/^(png|jpe?g|gif|webp|svg|bmp|avif)$/.test(ext)||file.type.startsWith('image/');
   const isVid=/^(mp4|mov|webm|mkv|m4v)$/.test(ext)||file.type.startsWith('video/');
   const isAud=/^(mp3|wav|m4a|flac|ogg|aac)$/.test(ext)||file.type.startsWith('audio/');
   if(ext==='pdf'){
     body.innerHTML=bar()+`<div class="pv-stage"><iframe src="${url}#toolbar=0"></iframe></div>`;wire();return;

     body.innerHTML=bar()+`<div class="pv-stage"><img src="${url}" alt=""><div class="pv-zoom"><button data-z="-">−</button><span>100%</span><button data-z="+">+</button><button data-z="0">⤢</button></div></div>`;

     body.querySelector('[data-z="-"]').onclick=()=>setZ(z-.25);
     body.querySelector('[data-z="+"]').onclick=()=>setZ(z+.25);
     body.querySelector('[data-z="0"]').onclick=()=>setZ(1);
     return;

   if(ext==='docx'||ext==='doc'){
     if(ext==='doc'){body.innerHTML=bar()+`<div class="pv-stage"><div class="pv-fallback"><div class="fico" style="width:72px;height:72px">${fileIcon(meta.name)}</div><b>Legacy .doc format</b><p>Browsers can only render modern .docx files. Use Save to keep a copy.</p></div></div>`;wire();return}

     show(wb.SheetNames[0]);wire();return;
   }
   if(ext==='zip'||ext==='rar'){
     if(ext==='rar'||!window.JSZip){body.innerHTML=bar()+`<div class="pv-stage"><div class="pv-fallback"><b>.rar not supported</b><p>ZIP archives can be listed; RAR needs a desktop app.</p></div></div>`;wire();return}
     const zip=await JSZip.loadAsync(file);

     body.innerHTML=bar()+`<div class="zip-list">${rows.map(r=>`<div class="zip-row">${r.dir?FOLDER:fileIcon(r.name)}<span>${r.name}</span></div>`).join('')}</div>`;
     wire();return;
   }
   if(/^(txt|md|markdown|log|json|js|ts|html|css|py|c|cpp|java|sh|yml|yaml|xml|sql|ini|env)$/.test(ext)){

   }
   body.innerHTML=bar()+`<div class="pv-stage"><div class="pv-fallback"><div class="fico" style="width:72px;height:72px">${fileIcon(meta.name)}</div><b>${meta.name}</b><p>No built-in renderer for this format. You can still save it or open it in a new tab.</p></div></div>`;
   wire();
 }catch(err){
   body.innerHTML=`<div class="pv-stage"><div class="pv-fallback"><b>Couldn't open file</b><p>${String(err&&err.message||err)}</p></div></div>`;
 }
}
function md2html(t){
 const esc=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
 return esc.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>')
  .replace(/`([^`]+)`/g,'<code style="background:#eee;padding:1px 5px;border-radius:4px">$1</code>')
  .replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\n{2,}/g,'<br><br>');
}

 ];
 function startPage(){

   frame.removeAttribute('src');

   ];

   for(const api of apis){
     try{

   er.querySelector('[data-d]').onclick=()=>loadURL(url,'direct');

 function loadURL(url,mode){

 }
 frame.addEventListener('load',()=>{if(frame.src&&frame.src!=='about:blank')progress(true)});
 urlIn.addEventListener('keydown',e=>{if(e.key==='Enter'){navigate(urlIn.value);urlIn.blur()}});
 btnB.onclick=()=>{if(hi>0){hi--;showCurrent()}};
 btnF.onclick=()=>{if(hi<hist.length-1){hi++;showCurrent()}};
 btnR.onclick=()=>{if(hi>=0)showCurrent()};
 btnPx.onclick=()=>{if(hi>=0){const e=hist[hi];e.mode=e.mode==='proxy'?'direct':'proxy';showCurrent()}};
 btnEx.onclick=()=>{if(hi>=0)window.open(hist[hi].url,'_blank')};
 startPage();

function buildCalc(body,win){
 body.innerHTML=`<div class="calc"><div class="c-expr" id="cExpr"></div><div class="c-disp">0</div><div class="c-pad">
  ${[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['0','zero'],['.',''],['=','op']].map(b=>`<button class="c-btn ${b[1]}" data-k="${b[0]}">${b[0]}</button>`).join('')}</div></div>`;
 const disp=body.querySelector('.c-disp'), expr=body.querySelector('#cExpr');
 let cur='0',acc=null,op=null,fresh=true;
 const calc=(a,b,o)=>o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:(b===0?'Error':a/b);
 const fmt=n=>{
   if(n==='Error')return n;
   const s=String(n);
   if(s.length>9){const x=(+n).toExponential(5);return x.replace('+','').replace('e','e')}
   if(s.includes('.'))return s;
   return (+n).toLocaleString('en-US');
 };
 const show=()=>{
   disp.textContent=fmt(cur);
   const n=String(disp.textContent).replace(/,/g,'').length;
   disp.style.fontSize=n>8?'36px':n>6?'46px':'56px';
   body.querySelectorAll('.op').forEach(b=>b.classList.toggle('on',!fresh&&{'÷':'/','×':'*','−':'-','+':'+'}[b.dataset.k]===op));
   const ac=body.querySelector('[data-k="AC"]');
   if(ac)ac.textContent=(cur!=='0'&&!fresh)?'C':'AC';
   expr.textContent=acc!==null&&op? (fmt(acc)+' '+({'\/':'÷','*':'×','-':'−','+':'+'}[op]||op)) : '';
 };
 function press(k){
   if(k>='0'&&k<='9'){cur=fresh||cur==='0'?k:cur+k;fresh=false}
   else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!String(cur).includes('.'))cur+='.'}
   else if(k==='AC'||k==='C'){if(k==='C'||(cur!=='0'&&!fresh)){cur='0';fresh=true}else{cur='0';acc=null;op=null;fresh=true}}
   else if(k==='±')cur=String(cur).startsWith('-')?String(cur).slice(1):(cur==='0'?cur:'-'+cur)
   else if(k==='%')cur=String(parseFloat(cur)/100)
   else if(k==='='){if(op&&acc!==null){cur=String(calc(acc,parseFloat(cur),op));acc=null;op=null;fresh=true}}
   else{const map={'÷':'/','×':'*','−':'-','+':'+'};
     if(op&&!fresh&&acc!==null)cur=String(calc(acc,parseFloat(cur),op));
     acc=parseFloat(cur);op=map[k];fresh=true}
   show();
 }
 body.querySelectorAll('.c-btn').forEach(b=>b.onclick=()=>press(b.dataset.k));
 win.calcPress=k=>{
   if(k==='Enter'||k==='=')press('=');
   else if(k==='Escape')press('AC');
   else if(k==='Backspace'){if(!fresh){cur=String(cur).length>1?String(cur).slice(0,-1):'0';show()}}
   else if('0123456789.+-*/%'.includes(k))press(k==='/'?'÷':k==='*'?'×':k==='-'?'−':k);
 };
 show();
}

   print(`<span class="p-user">apple_user@macbook</span> <span class="p-path">${esc(cwd.length===root.length?'~':cwd.slice(root.length-1).join('/'))}</span> % ${esc(line)}`);
   const trimmed=line.trim();if(!trimmed)return;
   const [c,...args]=trimmed.split(/\s+/);hist.push(trimmed);hp=hist.length;
   if(c==='echo')print(esc(args.join(' ')));
   else if(c==='open'){const id=(args[0]||'').toLowerCase();if(Apps[id]&&Apps[id].build){openApp(id);print(`Opening ${esc(Apps[id].name)}…`)}else print(`<span class="err">open: “${esc(args[0]||'')}” not found</span>`)}
   else if(CMDS[c])CMDS[c](args);
   else print(`<span class="err">zsh: command not found: ${esc(c)}</span>`);
 }

 inp.addEventListener('keydown',e=>{
   if(e.key==='Enter'){run(buf);buf='';inp.value='';promptLine()}

   else if(e.key==='ArrowUp'){if(hp>0){hp--;buf=hist[hp]||'';inp.value=buf}}
   else if(e.key==='ArrowDown'){if(hp<hist.length){hp++;buf=hist[hp]||'';inp.value=buf}}
   else if(e.key.length===1&&!e.metaKey&&!e.ctrlKey)buf+=e.key;
   const b=scr.querySelector('#tbuf');if(b)b.textContent=buf;
   scr.scrollTop=scr.scrollHeight;
 });
 inp.addEventListener('input',()=>{buf=inp.value;const b=scr.querySelector('#tbuf');if(b)b.textContent=buf});

   }

 if(/^[\d+\-*/().\s%]+$/.test(q)&&/[+\-*/]/.test(q)){
   try{const v=Function('"use strict";return('+q.replace(/%/g,'/100')+')')();

      const parsed = new URL(requested, document.baseURI);
      if(parsed.origin === window.location.origin) target = parsed;
    }catch(_){ /* malformed return URL: use the local fallback */ }
  }
  target.searchParams.set('terminal','1');
  window.location.replace(target.href);
}
function sleepNow(){closeOverlays();$('#sleepOv').classList.add('on')}
$('#sleepOv').addEventListener('pointerdown',()=>{
 $('#sleepOv').classList.remove('on');
 setTimeout(()=>{$('#desktop').classList.remove('ready');S.logged=false;closeAllWins();bootQuick()},300);
});
function bootQuick(){let p=0;const b=$('#boot');b.classList.remove('hidden');const fill=$('#bootFill');fill.style.width='0';
 const iv=setInterval(()=>{p+=Math.random()*22;if(p>=100){p=100;clearInterval(iv);setTimeout(()=>{b.classList.add('hidden');showLogin()},350)}fill.style.width=p+'%'},140)}
function restart(){closeOverlays();$('#desktop').classList.remove('ready');S.logged=false;closeAllWins();setTimeout(()=>bootSeq(),600)}
function shutDown(){
 closeOverlays();$('#desktop').classList.remove('ready');S.logged=false;closeAllWins();
 setTimeout(()=>{$('#off').classList.add('on');setTimeout(returnToCommandTerminal,700)},700)
}
$('#off').addEventListener('click',returnToCommandTerminal);
function lockScreen(){closeOverlays();$('#desktop').classList.remove('ready');S.logged=false;showLogin()}
function logOut(){closeOverlays();$('#desktop').classList.remove('ready');S.logged=false;closeAllWins();showLogin()}
function closeAllWins(){Object.values(S.wins).forEach(w=>w.remove());S.wins={};S.active=null;updateDots()}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.code==='Space'){e.preventDefault();toggleSP();return}
 if(e.key==='Escape'){
   if($('#ctx').classList.contains('on')){$('#ctx').classList.remove('on');return}
   if($('#lp').classList.contains('on')){toggleLP(false);return}
   if($('#sp').classList.contains('on')){toggleSP(false);return}
   if($('#cc').classList.contains('on')||$('#nc').classList.contains('on')){closeOverlays();return}
 }
 if((e.metaKey||e.ctrlKey)&&e.key==='w'&&S.active){e.preventDefault();closeWin(S.active);return}
 if((e.metaKey||e.ctrlKey)&&e.key==='m'&&S.active){e.preventDefault();minimizeWin(S.active);return}
 if(S.active&&S.active.calcPress){
   const el=document.activeElement;
   if(!el.isContentEditable&&el.tagName!=='INPUT')S.active.calcPress(e.key);
 }
});

/* ---------- init ---------- */
setWallpaper(0,false);
buildDock();buildLP();buildCC();buildNC();renderMenus();setBright(1);
addEventListener('resize',()=>{
 $$('.window').forEach(w=>{
   w.style.left=Math.min(w.offsetLeft,innerWidth-80)+'px';
   w.style.top=Math.min(Math.max(MB_H+4,w.offsetTop),innerHeight-60)+'px';
 });
});
bootSeq();

<script>
(()=>{
  'use strict';
  // The parent Command Center owns fullscreen for embedded boots. This guard is
  // only for opening the OS HTML directly in a tab.
  if(window.parent!==window || new URLSearchParams(location.search).get('embedded')==='1') return;
  const overlay=document.createElement('div');
  overlay.className='standalone-os-fs';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.innerHTML=`<div class="standalone-os-fs-card"><div class="standalone-os-fs-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></div><h2>Enter Fullscreen</h2><p>macOS works best as a complete desktop. Select the button to enter Fullscreen Mode.</p><button type="button">Fullscreen Mode</button></div>`;
  document.body.appendChild(overlay);
  const button=overlay.querySelector('button');
  const title=overlay.querySelector('h2');
  const copy=overlay.querySelector('p');
  const fn=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
  const supported=typeof fn==='function';
  let entered=false;
  const active=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const sync=()=>{
    const on=active();
    if(on)entered=true;
    document.documentElement.classList.toggle('standalone-css-fullscreen',!on);
    if(!supported){overlay.classList.remove('show');return;}
    overlay.classList.toggle('show',!on);
    if(!on){
      title.textContent=entered?'Return to Fullscreen':'Enter Fullscreen';
      copy.textContent=entered
        ?'macOS is still running. Select the button to restore Fullscreen Mode.'
        :'macOS works best as a complete desktop. Select the button to enter Fullscreen Mode.';
      setTimeout(()=>button.focus({preventScroll:true}),0);
    }
  };
  const enter=async()=>{
    if(!supported){sync();return false;}
    button.disabled=true;
    try{
      const result=fn.call(document.documentElement);
      if(result&&typeof result.then==='function')await result;
      entered=true;
      return true;
    }catch(_){overlay.classList.add('show');return false;}
    finally{button.disabled=false;setTimeout(sync,0)}
  };
  button.addEventListener('click',enter);
  // A normal OS interaction is also a valid user gesture. Use the first one
  // opportunistically without blocking the control selected underneath it.
  document.addEventListener('pointerdown',event=>{
    if(supported&&!active()&&!event.target.closest('.standalone-os-fs button')) enter();
  },{capture:true,once:true});
  document.addEventListener('fullscreenchange',sync);
  document.addEventListener('webkitfullscreenchange',sync);
  sync();
  // Best effort for hosts that permit launch fullscreen. Standards-compliant
  // browsers otherwise leave the explicit one-click recovery control visible.
  enter();
})();
</script>
